[project]
name = "noshow-guard"
version = "0.1.0"
description = "Predicción de inasistencia a citas médicas con API, monitoreo y acciones de recordatorio."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Las dependencias de runtime se agregan fase por fase (pandas, lightgbm, fastapi...).
dependencies = []

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "ruff==0.13.2",
    "mypy==1.18.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noshow_guard"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["noshow_guard"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
