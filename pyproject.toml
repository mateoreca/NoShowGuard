[project]
name = "noshow-guard"
version = "0.1.0"
description = "Predicción de inasistencia a citas médicas con API, monitoreo y acciones de recordatorio."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Las dependencias de runtime se agregan fase por fase (pandas, lightgbm, fastapi...).
dependencies = [
    "joblib==1.5.2",
    "lightgbm==4.6.0",
    "matplotlib==3.10.6",
    "numpy==2.3.3",
    "pandas==2.3.2",
    "pyarrow==21.0.0",
    "scikit-learn==1.7.2",
    "scipy==1.16.2",
    "seaborn==0.13.2",
    "shap==0.48.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "ruff==0.13.2",
    "mypy==1.18.2",
    "nbconvert==7.16.6",
    "ipykernel==6.30.1",
    "nbformat==5.10.4",
    "pandas-stubs==2.3.2.250926",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noshow_guard"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
# X / X_train en mayúscula es la convención de ML para matrices de features.
ignore = ["N803", "N806"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["noshow_guard"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
